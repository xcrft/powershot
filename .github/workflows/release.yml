name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write     # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@0xcraft/powershot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts

      # the tag must name the version being published, or the tag is a lie about
      # what the registry holds
      - name: The tag and package.json must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      - run: npm test

      # --provenance signs a statement linking the tarball to this workflow run and
      # commit, which is what makes "this came from that source" checkable
      # built and proven before anything is published: an artifact that fails its
      # own smoke test must not already be on a registry nobody can unpublish from
      - name: Pack and checksum the artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          mapfile -t TARBALLS < <(find dist-pack -maxdepth 1 -type f -name '*.tgz' -print)
          [ "${#TARBALLS[@]}" -eq 1 ] || { echo "::error::expected one tarball, found ${#TARBALLS[@]}"; exit 1; }
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_OUTPUT"
          TARBALL_NAME=$(basename "${TARBALLS[0]}")
          (cd dist-pack && shasum -a 256 "$TARBALL_NAME" > SHA256SUMS)

      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json

      - name: The packed artifact must install and run
        run: npm run smoke -- "${{ steps.artifact.outputs.tarball }}"

      - name: Publish the exact artifact that passed smoke
        run: npm publish "./${{ steps.artifact.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          files: |
            dist-pack/*.tgz
            dist-pack/SHA256SUMS
            sbom.cyclonedx.json
          generate_release_notes: true
